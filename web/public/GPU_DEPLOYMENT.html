<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Deployment Guide - z21-Terminal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        h1 { color: #ff9500; border-bottom: 2px solid #ff9500; padding-bottom: 10px; }
        h2 { color: #06d6a0; margin-top: 40px; }
        h3 { color: #64748b; }
        code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            color: #ff9500;
        }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border-left: 3px solid #ff9500;
        }
        pre code { background: none; padding: 0; }
        ul, ol { padding-left: 25px; }
        a { color: #06d6a0; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .note { 
            background: #2a2a2a; 
            padding: 15px; 
            border-left: 4px solid #ff9500; 
            margin: 20px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="content"></div>
    <script>
        fetch('/GPU_DEPLOYMENT.md')
            .then(r => r.text())
            .then(md => {
                document.getElementById('content').innerHTML = marked.parse(md);
            });
    </script>
</body>
</html>
